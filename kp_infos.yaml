# Keypoints, skeleton and measurements of the project: the ONLY place they are defined.
#
# Every module reads this file (through kp_infos.py next to it, or directly for
# modules/architectures): annotation tools, pose training, measurement-validity
# classifiers and the inference pipeline.
#
# FIXED ORDER: the index of a keypoint is baked into every trained model and every
# exported dataset. To add a point, append it at the END of `keypoints` and bump
# `schema_version`; never reorder or rename.

name: insect42_v1
schema_version: 1
status: VALIDATED              # schema validated by the project's expert (ADR-0006)
union_space: insect42_v1       # all datasets share this schema: the union mapping is the identity

# OKS sigma of a keypoint = difficulty * scale (ADR-0007). `difficulty` is how hard the
# point is to place precisely (10 = easy, 40 = very hard). Changing `scale` changes the
# DEFINITION of the OKS.
sigma_from_difficulty:
  scale: 0.0025

insect_groups: [coleoptera, diptera, hymenoptera, lepidoptera]

# name       keypoint name, as used in the Label Studio template and in every CSV
# difficulty positioning difficulty (see sigma_from_difficulty)
# flip       left/right counterpart (null on the midline): horizontal-flip augmentation
# color      display colour, **BGR** like the annotation interface
# layout     position on the schematic insect of the report figures, in half body
#            lengths (x to the right, y downwards)
keypoints:
  - {name: head-top,             difficulty: 10, flip: null,                 color: [0, 0, 255],     layout: [0.00, -1.20]}
  - {name: head-left,            difficulty: 20, flip: head-right,           color: [75, 0, 225],    layout: [-0.26, -0.94]}
  - {name: head-right,           difficulty: 20, flip: head-left,            color: [0, 75, 225],    layout: [0.26, -0.94]}
  - {name: left-eye,             difficulty: 15, flip: right-eye,            color: [220, 200, 200], layout: [-0.10, -1.03]}
  - {name: right-eye,            difficulty: 15, flip: left-eye,             color: [200, 220, 200], layout: [0.10, -1.03]}
  - {name: neck,                 difficulty: 10, flip: null,                 color: [0, 0, 200],     layout: [0.00, -0.78]}
  - {name: thorax-left,          difficulty: 30, flip: thorax-right,         color: [50, 150, 255],  layout: [-0.26, -0.50]}
  - {name: thorax-right,         difficulty: 30, flip: thorax-left,          color: [0, 200, 255],   layout: [0.26, -0.50]}
  - {name: thorax-bottom,        difficulty: 20, flip: null,                 color: [0, 255, 255],   layout: [0.00, -0.22]}
  - {name: body-left,            difficulty: 30, flip: body-right,           color: [100, 200, 100], layout: [-0.21, 0.18]}
  - {name: body-right,           difficulty: 30, flip: body-left,            color: [0, 255, 100],   layout: [0.21, 0.18]}
  - {name: body-tip,             difficulty: 10, flip: null,                 color: [0, 255, 0],     layout: [0.00, 0.72]}
  - {name: left-antenna-0,       difficulty: 10, flip: right-antenna-0,      color: [255, 255, 0],   layout: [-0.18, -1.30]}
  - {name: left-antenna-1,       difficulty: 30, flip: right-antenna-1,      color: [255, 255, 150], layout: [-0.38, -1.54]}
  - {name: left-antenna-2,       difficulty: 10, flip: right-antenna-2,      color: [255, 255, 200], layout: [-0.58, -1.68]}
  - {name: right-antenna-0,      difficulty: 10, flip: left-antenna-0,       color: [200, 255, 0],   layout: [0.18, -1.30]}
  - {name: right-antenna-1,      difficulty: 30, flip: left-antenna-1,       color: [200, 255, 150], layout: [0.38, -1.54]}
  - {name: right-antenna-2,      difficulty: 10, flip: left-antenna-2,       color: [200, 255, 200], layout: [0.58, -1.68]}
  - {name: left-forewing-base,   difficulty: 20, flip: right-forewing-base,  color: [255, 0, 200],   layout: [-0.44, -0.60]}
  - {name: left-forewing-tip,    difficulty: 20, flip: right-forewing-tip,   color: [150, 0, 200],   layout: [-1.44, -1.16]}
  - {name: left-forewing-front,  difficulty: 40, flip: right-forewing-front, color: [200, 0, 255],   layout: [-0.96, -1.06]}
  - {name: left-forewing-rear,   difficulty: 40, flip: right-forewing-rear,  color: [175, 0, 150],   layout: [-0.94, -0.54]}
  - {name: right-forewing-base,  difficulty: 20, flip: left-forewing-base,   color: [150, 50, 200],  layout: [0.44, -0.60]}
  - {name: right-forewing-tip,   difficulty: 20, flip: left-forewing-tip,    color: [150, 150, 200], layout: [1.44, -1.16]}
  - {name: right-forewing-front, difficulty: 40, flip: left-forewing-front,  color: [150, 100, 255], layout: [0.96, -1.06]}
  - {name: right-forewing-rear,  difficulty: 40, flip: left-forewing-rear,   color: [150, 100, 150], layout: [0.94, -0.54]}
  - {name: left-hindwing-base,   difficulty: 30, flip: right-hindwing-base,  color: [150, 100, 100], layout: [-0.32, -0.18]}
