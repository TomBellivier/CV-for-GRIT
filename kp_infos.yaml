  - {name: left-leg-3,           difficulty: 10, flip: right-leg-3,          color: [255, 200, 255], layout: [-0.88, 1.06]}
  - {name: right-leg-0,          difficulty: 20, flip: left-leg-0,           color: [200, 200, 0],   layout: [0.30, 0.02]}
  - {name: right-leg-1,          difficulty: 20, flip: left-leg-1,           color: [200, 200, 125], layout: [0.52, 0.34]}
  - {name: right-leg-2,          difficulty: 20, flip: left-leg-2,           color: [200, 200, 175], layout: [0.72, 0.70]}
  - {name: right-leg-3,          difficulty: 10, flip: left-leg-3,           color: [200, 200, 255], layout: [0.88, 1.06]}

