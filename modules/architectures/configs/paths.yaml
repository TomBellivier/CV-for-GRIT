# Seul endroit qui declare des racines de chemins. Surchargeable par machine :
#   python -m insectpose.cli train paths.root=/scratch/insectpose
paths:
  root: ${oc.env:INSECTPOSE_ROOT,.}
  data: ${paths.root}/data
  raw: ${paths.data}/raw
  interim: ${paths.data}/interim
  processed: ${paths.data}/processed
  splits: ${paths.data}/splits
  runs: ${paths.root}/runs
  # Analyses (tableaux, figures, rapports) : dans le dossier `results/` a la racine du
  # depot, qui rassemble les analyses de tous les modules (voir results/README.md).
  results: ${paths.root}/../../results/pose
  reports: ${paths.results}/reports
  configs: ${paths.root}/configs
  # Modeles retenus, a la racine du depot : seule sortie du module lue par
  # pipeline/ (voir retained_models/README.md). Sur une machine ou `root` n'est
  # pas modules/architectures, la surcharger : paths.retained=/chemin/absolu
  retained: ${paths.root}/../../retained_models
