# The only place that declares path roots. Overridable per machine:
#   python -m insectpose.cli train paths.root=/scratch/insectpose
paths:
  root: ${oc.env:INSECTPOSE_ROOT,.}
  data: ${paths.root}/data
  raw: ${paths.data}/raw
  interim: ${paths.data}/interim
  processed: ${paths.data}/processed
  splits: ${paths.data}/splits
  runs: ${paths.root}/runs
  # Analyses (tables, figures, reports): in the `results/` folder at the repository
  # root, which gathers the analyses of every module (see results/README.md).
  results: ${paths.root}/../../results/pose
  reports: ${paths.results}/reports
  configs: ${paths.root}/configs
  # Retained models, at the repository root: the only output of the module read by
  # pipeline/ (see retained_models/README.md). On a machine where `root` is not
  # modules/architectures, override it: paths.retained=/absolute/path
  retained: ${paths.root}/../../retained_models
