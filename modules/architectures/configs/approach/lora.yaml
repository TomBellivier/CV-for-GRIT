# @package _global_
# Approach D: LoRA adapters on a pre-trained YOLO-pose (ADR-0025).
approach:
  name: lora
  _target_: insectpose.approaches.lora.LoraApproach

  # ADR-0033: yolo26n is the FROZEN base model of the six approaches. A different size
  # would change the capacity of the network, and the comparison would then be about it
  # rather than about the method. To compare starting weights (side study, outside the
  # main table):
  #   python -m insectpose.cli train experiment=exp_a_yolo_pooled \
  #       approach.weights=yolo11n-pose.pt tag=yolo11n
  # The `tag` is MANDATORY: without it, the two variants would be told apart by their
  # variant_hash but would carry the same label in the figures.
  weights: yolo26n-pose.pt
  prunable: false

  lora:
    r: 8                        # rank of the adapters
    # ADR-0031: alpha is NOT searched separately. The literature converges: alpha=2r is
    # crucial at high ranks, and the alpha/r prefactor makes the optimal learning rate
    # almost independent of the rank. Searching alpha on top of r would explore a
    # redundancy and waste a dimension of the budget.
    alpha_ratio: 2.0            # alpha = alpha_ratio x r, computed at run time
    alpha: null                 # set => overrides the ratio (side study)
    dropout: 0.0
    # Number of blocks, at the end of the neck, receiving the adapters. The indices are
    # computed from the structure of the model: changing its size (n/s/m/l) breaks nothing.
    neck_blocks: 3
    # ADR-0025: the heads stay trainable, everything else is frozen. It is THE hidden
    # variable of LoRA comparisons: the manifest records the exact number of trainable
    # parameters, without which "LoRA rank 8" means nothing.
    train_head: true

  # --- inference ---
  max_det: 1
  conf: 0.001
  iou: 0.7
  inference_precision: fp16
  predict_chunk_size: 16

  # --- optimisation ---
  # Few trained parameters: a larger step than in full training is usual.
  optimizer: auto
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  box: 7.5
  pose: 12.0
  kobj: 1.0
  cls: 0.5
  dfl: 1.5
  fliplr: 0.5
  degrees: 10.0
  translate: 0.1
  scale: 0.5
  mosaic: 1.0
  close_mosaic: 10
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

  # ADR-0031: FOUR hyperparameters, budget identical to the other approaches.
  # `lora.r` sets the capacity of the adapter, `neck_blocks` its extent, and `lr0` stays
  # the dominant lever — the literature recommends sweeping the learning rate and keeping
  # the highest value that stays stable. Range raised compared with the base: the optimal
  # rate in LoRA is typically well above that of a full training, with far fewer trained
  # parameters.
  search_space:
    lr0: {type: float, low: 1.0e-4, high: 1.0e-1, log: true}
    lora.r: {type: categorical, choices: [4, 8, 16, 32]}
    lora.neck_blocks: {type: int, low: 1, high: 5}
    pose: {type: float, low: 4.0, high: 30.0}
