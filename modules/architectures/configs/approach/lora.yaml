# @package _global_
# Approche D : adaptateurs LoRA sur un YOLO-pose pre-entraine (ADR-0025).
approach:
  name: lora
  _target_: insectpose.approaches.lora.LoraApproach

  # ADR-0033 : yolo26n est le modele de base FIGE des six approches. Une taille
  # differente changerait la capacite du reseau, et la comparaison porterait alors sur
  # elle plutot que sur la methode. Pour comparer des poids de depart (etude annexe,
  # hors tableau principal) :
  #   python -m insectpose.cli train experiment=exp_a_yolo_pooled \
  #       approach.weights=yolo11n-pose.pt tag=yolo11n
  # Le `tag` est OBLIGATOIRE : sans lui, les deux variantes seraient distinguees par
  # leur variant_hash mais porteraient la meme etiquette dans les figures.
  weights: yolo26n-pose.pt
  prunable: false

  lora:
    r: 8                        # rang des adaptateurs
    # ADR-0031 : alpha n'est PAS cherche separement. La litterature converge : alpha=2r
    # est crucial aux rangs eleves, et le prefacteur alpha/r rend le taux d'apprentissage
    # optimal quasi independant du rang. Chercher alpha en plus de r explorerait une
    # redondance et gaspillerait une dimension du budget.
    alpha_ratio: 2.0            # alpha = alpha_ratio x r, calcule a l'execution
    alpha: null                 # renseigne => ecrase le ratio (etude annexe)
    dropout: 0.0
    # Nombre de blocs, en fin de cou, recevant les adaptateurs. Les index sont calcules
    # depuis la structure du modele : changer de taille (n/s/m/l) ne casse rien.
    neck_blocks: 3
    # ADR-0025 : les tetes restent entrainables, tout le reste est gele. C'est LA
    # variable cachee des comparaisons LoRA : le manifeste enregistre le nombre exact
    # de parametres entrainables, sans quoi "LoRA rang 8" ne veut rien dire.
    train_head: true

  # --- inference ---
  max_det: 1
  conf: 0.001
  iou: 0.7
  inference_precision: fp16
  predict_chunk_size: 16

  # --- optimisation ---
  # Peu de parametres entraines : un pas plus grand qu'en entrainement complet est usuel.
  optimizer: auto
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  box: 7.5
  pose: 12.0
  kobj: 1.0
  cls: 0.5
  dfl: 1.5
  fliplr: 0.5
  degrees: 10.0
  translate: 0.1
  scale: 0.5
  mosaic: 1.0
  close_mosaic: 10
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

  # ADR-0031 : QUATRE hyperparametres, budget identique aux autres approches.
  # `lora.r` fixe la capacite de l'adaptateur, `neck_blocks` son etendue, et `lr0` reste
  # le levier dominant — la litterature recommande de balayer le taux d'apprentissage en
  # retenant la plus haute valeur qui reste stable. Plage relevee par rapport au socle :
  # le taux optimal en LoRA est typiquement bien superieur a celui d'un entrainement
  # complet, a nombre de parametres entraines bien moindre.
  search_space:
    lr0: {type: float, low: 1.0e-4, high: 1.0e-1, log: true}
    lora.r: {type: categorical, choices: [4, 8, 16, 32]}
    lora.neck_blocks: {type: int, low: 1, high: 5}
    pose: {type: float, low: 4.0, high: 30.0}