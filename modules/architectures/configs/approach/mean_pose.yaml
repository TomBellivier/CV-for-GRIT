# @package _global_
# REFERENCE IMPLEMENTATION (template + floor baseline + smoke test).
# Uses the GT bboxes: bbox_source=gt => diagnostic only, never in the same table as the
# end-to-end approaches (CONVENTIONS.md §9.3).
approach:
  name: mean_pose
  _target_: insectpose.approaches.reference.MeanPoseApproach
  per_dataset_prior: true       # mean per dataset (true) or global (false)
  shrinkage: 0.0                # 0 = raw mean; >0 = towards the bbox centre
  search_space:
    shrinkage: {type: float, low: 0.0, high: 0.5}
    per_dataset_prior: {type: categorical, choices: [true, false]}
