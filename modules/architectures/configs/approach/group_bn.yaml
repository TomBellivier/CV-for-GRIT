# @package _global_
# Approche E : BatchNorm conditionnee par groupe d'insecte (ADR-0026).
approach:
  name: group_bn
  _target_: insectpose.approaches.group_bn.GroupBatchNormApproach

  # ADR-0033 : yolo26n est le modele de base FIGE des six approches. Une taille
  # differente changerait la capacite du reseau, et la comparaison porterait alors sur
  # elle plutot que sur la methode. Pour comparer des poids de depart (etude annexe,
  # hors tableau principal) :
  #   python -m insectpose.cli train experiment=exp_a_yolo_pooled \
  #       approach.weights=yolo11n-pose.pt tag=yolo11n
  # Le `tag` est OBLIGATOIRE : sans lui, les deux variantes seraient distinguees par
  # leur variant_hash mais porteraient la meme etiquette dans les figures.
  weights: yolo26n-pose.pt
  prunable: false

  group_norm:
    # ADR-0026 : toutes les BatchNorm2d du reseau, statistiques ET affines par groupe.
    # Les poids convolutifs restent partages : c'est l'hypothese testee.
    scope: all
    affine_per_group: true
    # ADR-0014 : le dataset est toujours declare a l'inference. Un groupe inconnu leve
    # une erreur explicite ; aucun repli n'est devine.
    on_unknown: error

  # --- inference ---
  max_det: 1
  conf: 0.001
  iou: 0.7
  inference_precision: fp16
  predict_chunk_size: 16

  # ADR-0031 : QUATRE hyperparametres, budget de 20 trials. Le taux d'apprentissage est
  # de loin le plus influent en apprentissage profond (analyses fANOVA : plus des deux
  # tiers de la variance sur LSTM, 2e rang sur CNN derriere la profondeur, qui est fixee
  # ici par le choix du modele). `pose` et `kobj` comptent particulierement hors domaine
  # COCO : avec les valeurs par defaut, la perte de pose peut ne pas descendre du tout
  # sur des keypoints non humains — et nous avons 42 points d'insecte.
  # Les parametres d'augmentation sont FIXES (ADR-0032), `lrf` aussi : il interagit avec
  # la duree d'entrainement et pese bien moins que `lr0`.
  search_space:
    lr0: {type: float, low: 1.0e-4, high: 5.0e-2, log: true}
    pose: {type: float, low: 4.0, high: 30.0}
    kobj: {type: float, low: 0.5, high: 8.0}
    weight_decay: {type: float, low: 1.0e-5, high: 1.0e-2, log: true}