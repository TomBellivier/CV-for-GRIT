# @package _global_
# Approche G : reentrainement des tetes seules (ADR-0035).
# Temoin indispensable de l'approche D : sur YOLO26 les tetes pesent ~2/3 des parametres
# a l'entrainement, donc "LoRA + tetes" en entraine ~67 % contre ~1,3 % d'adaptateurs.
# Sans ce temoin, un gain de D serait ininterpretable.
approach:
  name: head_only
  _target_: insectpose.approaches.head_only.HeadOnlyApproach

  weights: yolo26n-pose.pt      # ADR-0033 : meme base que les six autres approches
  prunable: false

  head:
    # Nombre de blocs FINAUX laisses entrainables. 1 = la tete seule ; au-dela, on
    # degele progressivement la fin du cou. Les index sont calcules depuis la structure
    # du modele, donc changer de taille de reseau ne casse rien.
    # Pour etre le temoin exact de D avec train_head=true, garder 1.
    blocks: 1

  # --- inference ---
  max_det: 1                    # ADR-0017 : une image = un insecte
  conf: 0.001                   # seuil BAS : ne jamais tronquer les courbes AP (§3.4)
  iou: 0.7
  inference_precision: fp16
  predict_chunk_size: 16        # ADR-0021 : inference bornee en memoire

  # --- optimisation ---
  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: false

  # --- ponderation des pertes ---
  box: 7.5
  pose: 12.0
  kobj: 1.0
  cls: 0.5
  dfl: 1.5

  # --- augmentation : FIXE (ADR-0032), identique aux autres approches ---
  fliplr: 0.5
  flipud: 0.0
  degrees: 10.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  mosaic: 1.0
  close_mosaic: 10
  mixup: 0.0
  erasing: 0.0

  # ADR-0031 : QUATRE hyperparametres, budget identique aux autres approches.
  # Memes cles que le socle A/B/E/F, pour que la comparaison avec D isole bien le
  # seul effet des adaptateurs et non un ecart de reglage.
  search_space:
    lr0: {type: float, low: 1.0e-4, high: 5.0e-2, log: true}
    pose: {type: float, low: 4.0, high: 30.0}
    kobj: {type: float, low: 0.5, high: 8.0}
    weight_decay: {type: float, low: 1.0e-5, high: 1.0e-2, log: true}