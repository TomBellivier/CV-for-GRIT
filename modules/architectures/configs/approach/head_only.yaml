# @package _global_
# Approach G: retraining the heads only (ADR-0035).
# Essential control of approach D: on YOLO26 the heads weigh ~2/3 of the parameters
# at training time, so "LoRA + heads" trains ~67 % of them against ~1.3 % of adapters.
# Without this control, a gain of D could not be interpreted.
approach:
  name: head_only
  _target_: insectpose.approaches.head_only.HeadOnlyApproach

  weights: yolo26n-pose.pt      # ADR-0033: same base as the six other approaches
  prunable: false

  head:
    # Number of FINAL blocks left trainable. 1 = the head only; beyond that, the end of
    # the neck is progressively unfrozen. The indices are computed from the structure
    # of the model, so changing the network size breaks nothing.
    # To be the exact control of D with train_head=true, keep 1.
    blocks: 1

  # --- inference ---
  max_det: 1                    # ADR-0017: one image = one insect
  conf: 0.001                   # LOW threshold: never truncate the AP curves (§3.4)
  iou: 0.7
  inference_precision: fp16
  predict_chunk_size: 16        # ADR-0021: memory-bounded inference

  # --- optimisation ---
  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: false

  # --- loss weights ---
  box: 7.5
  pose: 12.0
  kobj: 1.0
  cls: 0.5
  dfl: 1.5

  # --- augmentation: FIXED (ADR-0032), identical to the other approaches ---
  fliplr: 0.5
  flipud: 0.0
  degrees: 10.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  mosaic: 1.0
  close_mosaic: 10
  mixup: 0.0
  erasing: 0.0

  # ADR-0031: FOUR hyperparameters, budget identical to the other approaches.
  # Same keys as the A/B/E/F base, so that the comparison with D isolates the effect of
  # the adapters alone and not a tuning gap.
  search_space:
    lr0: {type: float, low: 1.0e-4, high: 5.0e-2, log: true}
    pose: {type: float, low: 4.0, high: 30.0}
    kobj: {type: float, low: 0.5, high: 8.0}
    weight_decay: {type: float, low: 1.0e-5, high: 1.0e-2, log: true}
