# @package _global_
# Approach B: one YOLO-pose model per insect order (CONVENTIONS.md §9.2).
# Same folds as approach A, simply restricted: this is what makes A and B comparable.
# The pipeline only sees one approach (ADR-0023).
approach:
  name: yolo_per_dataset
  _target_: insectpose.approaches.yolo_per_dataset.YoloPerDatasetApproach

  # ADR-0023: each model starts again from the BASE WEIGHTS, not from the pooled model.
  # A and B thus remain independent; the question asked is indeed "is a specialist
  # worth a generalist?", not "does specialisation bring anything after pooling?".
  # ADR-0033: yolo26n is the FROZEN base model of the six approaches. A different size
  # would change the capacity of the network, and the comparison would then be about it
  # rather than about the method. To compare starting weights (side study, outside the
  # main table):
  #   python -m insectpose.cli train experiment=exp_a_yolo_pooled \
  #       approach.weights=yolo11n-pose.pt tag=yolo11n
  # The `tag` is MANDATORY: without it, the two variants would be told apart by their
  # variant_hash but would carry the same label in the figures.
  weights: yolo26n-pose.pt
  prunable: false

  # --- inference ---
  max_det: 1                    # ADR-0017: one image = one insect
  conf: 0.001                   # LOW threshold: never truncate the AP curves (§3.4)
  iou: 0.7
  inference_precision: fp16
  predict_chunk_size: 16        # ADR-0021: memory-bounded inference

  # --- optimisation ---
  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: false

  # --- loss weights ---
  box: 7.5
  pose: 12.0
  kobj: 1.0
  cls: 0.5
  dfl: 1.5

  # --- augmentation ---
  fliplr: 0.5
  flipud: 0.0
  degrees: 10.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  mosaic: 1.0
  close_mosaic: 10
  mixup: 0.0
  erasing: 0.0

  # ADR-0023: the hyperparameters are SHARED by the 4 models. One Optuna trial trains
  # them all, so the HPO budget stays strictly equal to A's (§6.3). An independent search
  # per dataset would quadruple the budget: B would win through the optimisation.
  # ADR-0031: FOUR hyperparameters, budget of 20 trials. The learning rate is by far
  # the most influential one in deep learning (fANOVA analyses: more than two thirds of
  # the variance on LSTMs, 2nd rank on CNNs behind the depth, which is fixed here by the
  # choice of the model). `pose` and `kobj` matter particularly outside the COCO domain:
  # with the default values, the pose loss may not decrease at all on non-human
  # keypoints — and we have 42 insect points.
  # The augmentation parameters are FIXED (ADR-0032), and so is `lrf`: it interacts
  # with the training duration and weighs much less than `lr0`.
  search_space:
    lr0: {type: float, low: 1.0e-4, high: 5.0e-2, log: true}
    pose: {type: float, low: 4.0, high: 30.0}
    kobj: {type: float, low: 0.5, high: 8.0}
    weight_decay: {type: float, low: 1.0e-5, high: 1.0e-2, log: true}
