# @package _global_
# Approach C: pooled detection then pose on a normalised crop (CONVENTIONS.md §9.3).
# Two models trained in the same run, evaluated as a single system.
approach:
  name: detect_then_pose
  _target_: insectpose.approaches.detect_then_pose.DetectThenPoseApproach
  prunable: false

  # --- inference of the whole system ---
  max_det: 1                    # ADR-0017: one image = one insect
  conf: 0.001                   # LOW threshold: never truncate the AP curves (§3.4)
  iou: 0.7
  inference_precision: fp16
  predict_chunk_size: 16        # ADR-0021
  # Diagnostic ONLY: pose on GT bboxes. Writes bbox_source=gt, hence never in the
  # same table as the end-to-end approaches (§9.3).
  pose_on_gt_boxes: false

  # --- cropping ---
  crop:
    # ADR-0024: same resolution as the protocol (640), so that the comparison with
    # A and B is about the method and not the resolution.
    size: [640, 640]
    padding: 0.15               # margin around the bbox: without it, tarsi and
                                # antennae fall outside the crop and are unrecoverable
    # Training crops come from NOISY GT bboxes (§9.3): otherwise the model only
    # learns perfect framings it will never see again at inference.
    jitter_scale: 0.15
    jitter_shift: 0.10

  # --- detector (whole images, one class, no keypoints) ---
  detector:
    weights: yolo26n.pt        # ADR-0033
    lr0: 0.01
    lrf: 0.01
    momentum: 0.937
    weight_decay: 0.0005
    warmup_epochs: 3.0
    box: 7.5
    cls: 0.5
    dfl: 1.5
    degrees: 10.0
    translate: 0.1
    scale: 0.5
    fliplr: 0.5
    mosaic: 1.0
    close_mosaic: 10
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4

  # --- pose model (normalised crops) ---
  pose:
    weights: yolo26n-pose.pt   # ADR-0033
    lr0: 0.01
    lrf: 0.01
    momentum: 0.937
    weight_decay: 0.0005
    warmup_epochs: 3.0
    box: 7.5
    pose: 12.0
    kobj: 1.0
    cls: 0.5
    dfl: 1.5
    # On a crop, the insect is already framed and centred: mosaic and large translations
    # would destroy this framing, which is precisely what the approach brings.
    mosaic: 0.0
    translate: 0.05
    scale: 0.2
    degrees: 10.0
    fliplr: 0.5
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4

  # Budget identical to the other approaches' (§6.3). ADR-0031: FOUR hyperparameters.
  # With one insect per image (ADR-0017), detection is almost trivial: `detector.lr0`
  # is therefore frozen and the budget goes to the pose model and to the crop geometry,
  # which is what sets C apart from A.
  search_space:
    pose.lr0: {type: float, low: 1.0e-4, high: 5.0e-2, log: true}
    pose.pose: {type: float, low: 4.0, high: 30.0}
    crop.padding: {type: float, low: 0.0, high: 0.4}
    crop.jitter_scale: {type: float, low: 0.0, high: 0.3}
