[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insectpose"
version = "0.1.0"
description = "Pose estimation on 4 insect datasets - generic experimentation framework"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "optuna>=3.6",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pillow>=10",
    # ADR-0019: torch and ultralytics are first-rank dependencies.
    "torch>=2.1",
    "torchvision>=0.16",
    "ultralytics>=8.3",
    # ADR-0025: LoRA adapters of approach D.
    "peft>=0.11",
]

[project.optional-dependencies]
# Kept for compatibility: the dependencies are now in `dependencies`.
yolo = []
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
insectpose = "insectpose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "PTH"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

# Core of the contract: strict typing mandatory (CONVENTIONS.md 10)
[[tool.mypy.overrides]]
module = ["insectpose.contracts", "insectpose.registry", "insectpose.evaluation.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: minimal end-to-end test"]