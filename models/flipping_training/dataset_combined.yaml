# Combined DATASET config for a single training run over the 4 insect datasets.
# Pass this file to the training script with --data.
# (This is NOT the hyperparameters file. That one goes to --hyp.)

# Root folder that contains the 4 dataset directories. Ultralytics resolves the
# train/val paths below relative to this, and finds labels by swapping
# "images" -> "labels" in each path (your structure: {name}/{images,labels}/{split}).
path: ../datasets/

train:
  - Coleoptera/images/train
  - Hymenoptera/images/train
  - Diptera/images/train
  - Lepidoptera/images/train

val:
  - Coleoptera/images/val
  - Hymenoptera/images/val
  - Diptera/images/val
  - Lepidoptera/images/val

# --- Keypoint configuration (identical across the 4 datasets) ---
kpt_shape: [42, 3]   # 42 keypoints, 3 values each (x, y, visibility)

# flip_idx[i] = index that keypoint i becomes under a left/right mirror.
# Self-index for keypoints on the body axis; L<->R swap otherwise.
# Used for BOTH the horizontal and the vertical flip.
flip_idx: [0, 2, 1, 4, 3, 5, 7, 6, 8, 10, 9, 11, 15, 16, 17, 12, 13, 14, 22, 23, 24,
  25, 18, 19, 20, 21, 30, 31, 32, 33, 26, 27, 28, 29, 38, 39, 40, 41, 34, 35, 36,
  37]

names: {0: insects}

kpt_names:
  0: [head-top, head-left, head-right, left-eye, right-eye, neck, thorax-left, thorax-right,
    thorax-bottom, body-left, body-right, body-tip, left-antenna-0, left-antenna-1,
    left-antenna-2, right-antenna-0, right-antenna-1, right-antenna-2, left-forewing-base,
    left-forewing-tip, left-forewing-front, left-forewing-rear, right-forewing-base,
    right-forewing-tip, right-forewing-front, right-forewing-rear, left-hindwing-base,
    left-hindwing-tip, left-hindwing-front, left-hindwing-rear, right-hindwing-base,
    right-hindwing-tip, right-hindwing-front, right-hindwing-rear, left-leg-0, left-leg-1,
    left-leg-2, left-leg-3, right-leg-0, right-leg-1, right-leg-2, right-leg-3]