# @package _global_
tuning:
  # ADR-0012 : HPO niche. La boucle interne optimise sur le train du fold externe,
  # l'evaluation se fait sur le test externe jamais vu par la recherche.
  mode: nested                  # nested | tune_once
  n_trials: 40                  # DOIT etre identique entre approches (§6.3 budget equitable)
  timeout_s: null
  inner_folds: 3                # folds internes pour l'HPO
  tuning_outer_fold: 0          # utilise seulement si mode=tune_once
  sampler: tpe                  # tpe | random
  pruner: median                # median | none
  pruner_warmup_steps: 5
  storage: sqlite               # sqlite | none (in-memory, non reprenable)
  load_if_exists: true
  seed: 42
