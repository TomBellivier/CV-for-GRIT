schema_version: 1
name: insect42_v1
kind: dataset_schema
status: VALIDATED           # ADR-0006 : schema fourni et fige par l'expert du projet
union_space: insect42_v1    # les 4 datasets partagent CE schema : le mapping union est l'identite

# ORDRE FIGE A VIE : l'index d'un point est encode dans tous les artefacts produits.
# Ajouter un point => l'ajouter EN FIN de liste et bumper schema_version.
#
# sigma = difficulty * sigma_from_difficulty.scale (ADR-0007). `difficulty` est la difficulte
# de positionnement precis du point, fournie par l'expert (10 = facile, 40 = tres difficile).
# Changer `scale` change la DEFINITION de l'OKS : bumper eval.version et rejouer les runs.
sigma_from_difficulty:
  scale: 0.0025

