# @package _global_
# Approche C : detection poulee puis pose sur crop normalise (CONVENTIONS.md §9.3).
# Deux modeles entraines dans le meme run, evalues comme un seul systeme.
approach:
  name: detect_then_pose
  _target_: insectpose.approaches.detect_then_pose.DetectThenPoseApproach
  prunable: false

  # --- inference du systeme complet ---
  max_det: 1                    # ADR-0017 : une image = un insecte
  conf: 0.001                   # seuil BAS : ne jamais tronquer les courbes AP (§3.4)
  iou: 0.7
  inference_precision: fp16
  predict_chunk_size: 16        # ADR-0021
  # Diagnostic UNIQUEMENT : pose sur bboxes GT. Ecrit bbox_source=gt, donc jamais
  # dans le meme tableau que les approches bout-en-bout (§9.3).
  pose_on_gt_boxes: false

  # --- recadrage ---
  crop:
    # ADR-0024 : meme resolution que le protocole (640), pour que la comparaison avec
    # A et B porte sur la methode et non sur la resolution.
    size: [640, 640]
    padding: 0.15               # marge autour de la bbox : sans elle, tarses et
                                # antennes tombent hors du crop et sont irrecuperables
    # Les crops d'entrainement viennent de bboxes GT BRUITEES (§9.3) : sinon le modele
    # n'apprend que des cadrages parfaits qu'il ne reverra jamais a l'inference.
    jitter_scale: 0.15
    jitter_shift: 0.10

  # --- detecteur (images entieres, une classe, sans keypoints) ---
  detector:
    weights: yolo11n.pt
    lr0: 0.01
    lrf: 0.01
    momentum: 0.937
    weight_decay: 0.0005
    warmup_epochs: 3.0
    box: 7.5
    cls: 0.5
    dfl: 1.5
    degrees: 10.0
    translate: 0.1
    scale: 0.5
    fliplr: 0.5
    mosaic: 1.0
    close_mosaic: 10
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4

  # --- modele de pose (crops normalises) ---
  pose:
    weights: yolo11n-pose.pt
    lr0: 0.01
    lrf: 0.01
    momentum: 0.937
    weight_decay: 0.0005
    warmup_epochs: 3.0
    box: 7.5
    pose: 12.0
    kobj: 1.0
    cls: 0.5
    dfl: 1.5
    # Sur crop, l'insecte est deja cadre et centre : mosaique et grandes translations
    # detruiraient ce cadrage, qui est justement l'apport de l'approche.
    mosaic: 0.0
    translate: 0.05
    scale: 0.2
    degrees: 10.0
    fliplr: 0.5
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4

  # Budget identique a celui des autres approches (§6.3). L'espace couvre les deux
  # modeles : ne pas l'elargir sans elargir aussi celui des approches concurrentes.
  search_space:
    detector.lr0: {type: float, low: 1.0e-5, high: 1.0e-1, log: true}
    detector.box: {type: float, low: 2.0, high: 12.0}
    pose.lr0: {type: float, low: 1.0e-5, high: 1.0e-1, log: true}
    pose.pose: {type: float, low: 4.0, high: 24.0}
    pose.scale: {type: float, low: 0.0, high: 0.5}
    pose.degrees: {type: float, low: 0.0, high: 30.0}
    crop.padding: {type: float, low: 0.0, high: 0.4}
    crop.jitter_scale: {type: float, low: 0.0, high: 0.3}