# @package _global_
# Approche E : BatchNorm conditionnee par groupe d'insecte (ADR-0026).
approach:
  name: group_bn
  _target_: insectpose.approaches.group_bn.GroupBatchNormApproach

  weights: yolo11n-pose.pt      # ADR-0026 : entrainement complet depuis COCO
  prunable: false

  group_norm:
    # ADR-0026 : toutes les BatchNorm2d du reseau, statistiques ET affines par groupe.
    # Les poids convolutifs restent partages : c'est l'hypothese testee.
    scope: all
    affine_per_group: true
    # ADR-0014 : le dataset est toujours declare a l'inference. Un groupe inconnu leve
    # une erreur explicite ; aucun repli n'est devine.
    on_unknown: error

  # --- inference ---
  max_det: 1
  conf: 0.001
  iou: 0.7
  inference_precision: fp16
  predict_chunk_size: 16

  # --- optimisation ---
  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  box: 7.5
  pose: 12.0
  kobj: 1.0
  cls: 0.5
  dfl: 1.5
  fliplr: 0.5
  degrees: 10.0
  translate: 0.1
  scale: 0.5
  mosaic: 1.0
  close_mosaic: 10
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

  search_space:
    lr0: {type: float, low: 1.0e-5, high: 1.0e-1, log: true}
    lrf: {type: float, low: 1.0e-3, high: 0.5, log: true}
    weight_decay: {type: float, low: 1.0e-5, high: 1.0e-2, log: true}
    warmup_epochs: {type: float, low: 0.0, high: 5.0}
    pose: {type: float, low: 4.0, high: 24.0}
    box: {type: float, low: 2.0, high: 12.0}
    degrees: {type: float, low: 0.0, high: 30.0}
    scale: {type: float, low: 0.0, high: 0.7}